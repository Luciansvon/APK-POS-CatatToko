name: Apply audit patch and open PR

on:
  workflow_dispatch:
    inputs:
      patch_branch:
        description: Branch containing audit-fixes.patch
        required: true
        default: agent/full-repo-audit-fixes

permissions:
  contents: read

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TEMP_PR_TOKEN }}
      PATCH_BRANCH: ${{ inputs.patch_branch }}

    steps:
      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret TEMP_PR_TOKEN is missing."
            exit 1
          fi

      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.patch_branch }}
          token: ${{ secrets.TEMP_PR_TOKEN }}
          fetch-depth: 0

      - name: Validate patch file
        shell: bash
        run: |
          test -f audit-fixes.patch || {
            echo "::error::audit-fixes.patch was not found in branch $PATCH_BRANCH."
            exit 1
          }
          git apply --check audit-fixes.patch

      - name: Apply patch
        shell: bash
        run: |
          git apply --whitespace=fix audit-fixes.patch
          rm audit-fixes.patch

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::Patch produced no changes."
            exit 1
          fi

          git commit -m "fix: apply full repository audit fixes"
          git push origin "HEAD:$PATCH_BRANCH"

      - name: Open or update draft pull request
        shell: bash
        run: |
          existing_pr="$(gh pr list             --head "$PATCH_BRANCH"             --base main             --state open             --json number             --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists."
            gh pr edit "$existing_pr"               --title "fix: apply full repository audit fixes"               --body-file - <<'EOF'
          ## Ringkasan

          PR ini menerapkan perbaikan hasil audit menyeluruh repository APK-POS-CatatToko untuk tiga product flavor: Retail, Wholesale, dan Culinary.

          ## Ruang lingkup

          - Memperbaiki blocker transaksi dan manajemen stok.
          - Menutup masalah lifecycle restore backup.
          - Menjaga konfigurasi stock tracking saat produk diedit.
          - Membenahi alur variant, profil usaha, receipt, dan workforce.
          - Menambahkan atau memperbarui pengujian serta GitHub Actions.
          - Menyelaraskan dokumentasi dengan implementasi aktual.

          ## Validasi

          Status build dan test akan ditampilkan oleh GitHub Actions pada PR ini.
          EOF
          else
            gh pr create               --draft               --base main               --head "$PATCH_BRANCH"               --title "fix: apply full repository audit fixes"               --body-file - <<'EOF'
          ## Ringkasan

          PR ini menerapkan perbaikan hasil audit menyeluruh repository APK-POS-CatatToko untuk tiga product flavor: Retail, Wholesale, dan Culinary.

          ## Ruang lingkup

          - Memperbaiki blocker transaksi dan manajemen stok.
          - Menutup masalah lifecycle restore backup.
          - Menjaga konfigurasi stock tracking saat produk diedit.
          - Membenahi alur variant, profil usaha, receipt, dan workforce.
          - Menambahkan atau memperbarui pengujian serta GitHub Actions.
          - Menyelaraskan dokumentasi dengan implementasi aktual.

          ## Validasi

          Status build dan test akan ditampilkan oleh GitHub Actions pada PR ini.
          EOF
          fi
