name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build all flavors
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests for all flavors
        run: >
          ./gradlew
          testRetailDebugUnitTest
          testWholesaleDebugUnitTest
          testCulinaryDebugUnitTest
          --no-daemon
          --stacktrace

      - name: Build debug APKs and instrumentation APKs
        run: >
          ./gradlew
          assembleDebug
          assembleRetailDebugAndroidTest
          assembleWholesaleDebugAndroidTest
          assembleCulinaryDebugAndroidTest
          --no-daemon
          --stacktrace

      - name: Build minified release variants
        run: ./gradlew assembleRelease --no-daemon --stacktrace

  lint:
    name: Android lint all flavors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android lint for all flavors
        run: >
          ./gradlew
          lintRetailDebug
          lintWholesaleDebug
          lintCulinaryDebug
          --no-daemon
          --stacktrace
