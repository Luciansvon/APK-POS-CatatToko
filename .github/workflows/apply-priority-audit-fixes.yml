name: Apply priority audit fixes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.TEMP_PR_TOKEN }}
      BRANCH: agent/priority-audit-fixes

    steps:
