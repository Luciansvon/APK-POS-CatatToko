        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret TEMP_PR_TOKEN belum tersedia."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.TEMP_PR_TOKEN }}
          fetch-depth: 0

