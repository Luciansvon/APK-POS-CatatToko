      - name: Apply changes on audit branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B "$BRANCH" origin/main

          git apply --check /tmp/audit-fixes.patch
          git apply --whitespace=fix /tmp/audit-fixes.patch

          # Bootstrap workflow hanya alat sementara dan tidak ikut dipertahankan.
          rm -f             .github/workflows/apply-audit-patch.yml             .github/workflows/apply-priority-audit-fixes.yml

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::Patch tidak menghasilkan perubahan."
            exit 1
          fi

          git commit -m "fix: address priority audit findings and add CI"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Open or update draft pull request
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Ringkasan

          PR ini menangani temuan audit prioritas untuk shared source Retail,
          Wholesale, dan Culinary, serta menambahkan CI seluruh flavor.

          ## Diperbaiki

          - layout katalog compact tidak lagi terkunci pada tinggi 76 dp;
          - lifecycle file picker restore tidak mengunci sesi Owner secara prematur;
          - stok dan pembelian produk bervarian memiliki pemilih varian;
          - edit produk mempertahankan konfigurasi stock tracking;
          - pembuatan pekerja harian dan tarif awal menjadi atomik;
          - nama profil usaha dipakai pada snapshot transaksi;
          - indikator stok landing menghitung stok varian;
          - README dan arsitektur diselaraskan;
          - GitHub Actions menjalankan test, build, dan lint tiga flavor.

          ## Belum selesai

          Temuan tersisa dicatat secara eksplisit di
          `docs/AUDIT_2026-07-31.md`. PR ini tidak menyatakan seluruh backlog
          audit sudah selesai.

          ## Validasi

          Jangan merge sebelum seluruh pemeriksaan GitHub Actions hijau dan
          pengujian perangkat untuk tiga flavor selesai.
          EOF

          existing_pr="$(gh pr list             --head "$BRANCH"             --base main             --state open             --json number             --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr"               --title "fix: address priority audit findings and add CI"               --body-file /tmp/pr-body.md
            gh pr ready "$existing_pr" --undo || true
            echo "Draft PR #$existing_pr diperbarui."
          else
            gh pr create               --draft               --base main               --head "$BRANCH"               --title "fix: address priority audit findings and add CI"               --body-file /tmp/pr-body.md
          fi
