name: Android signed release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    name: Build and verify signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CATATTOKO_RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
      CATATTOKO_RELEASE_STORE_PASSWORD: ${{ secrets.CATATTOKO_RELEASE_STORE_PASSWORD }}
      CATATTOKO_RELEASE_KEY_ALIAS: ${{ secrets.CATATTOKO_RELEASE_KEY_ALIAS }}
      CATATTOKO_RELEASE_KEY_PASSWORD: ${{ secrets.CATATTOKO_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CATATTOKO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed release APKs
        run: ./gradlew verifyReleaseSigningReady assembleRelease --no-daemon --stacktrace

      - name: Verify signatures and package
        shell: pwsh
        run: ./scripts/package-release-apks.ps1

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: CatatToko-signed-release
          path: dist/release/*.apk
          if-no-files-found: error
          retention-days: 14
